<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tiny Pops" />
<meta name="theme-color" content="#1d1250" />
<title>Tiny Pops</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --indigo: #1d1250;
    --plum: #2b1766;
    --bubblegum: #ffc4dc;
    --butter: #fff3b0;
    --font: "Fredoka", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    inset: 0;
    background: var(--indigo);
    overscroll-behavior: none;
    touch-action: none;
    font-family: var(--font);
    color: #fff;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* ── Intro ─────────────────────────────────────────── */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(24px, env(safe-area-inset-left));
    transition: opacity 0.45s ease, visibility 0.45s;
  }
  .intro.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .card {
    width: min(580px, 100%);
    text-align: center;
    padding: clamp(30px, 6vh, 56px) clamp(24px, 5vw, 52px);
    border-radius: 44px;
    background: rgba(28, 14, 70, 0.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
    backdrop-filter: blur(18px) saturate(1.3);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 30px 80px rgba(8, 0, 30, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    animation: card-in 0.8s cubic-bezier(0.2, 1.1, 0.3, 1) backwards;
  }
  @keyframes card-in {
    from { opacity: 0; transform: scale(0.88) translateY(24px); }
  }

  h1 {
    margin: 0 0 14px;
    font-size: clamp(58px, 11vw, 112px);
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #fff;
    text-shadow: 0 4px 0 rgba(255, 120, 180, 0.55), 0 14px 40px rgba(255, 140, 200, 0.4);
  }

  .intro-text {
    margin: 0 0 32px;
    font-size: clamp(18px, 2.6vw, 24px);
    font-weight: 500;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.86);
  }

  .start {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    font-size: clamp(26px, 3.6vw, 36px);
    color: #3a1470;
    padding: 20px 70px 22px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--butter), var(--bubblegum));
    box-shadow: 0 10px 0 #d98ab0, 0 24px 44px rgba(255, 140, 190, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    animation: bob 2.6s ease-in-out 1.4s infinite;
  }
  .start:active {
    transform: translateY(7px);
    box-shadow: 0 3px 0 #d98ab0, 0 10px 24px rgba(255, 140, 190, 0.3);
  }
  @keyframes bob {
    50% { scale: 1.045; }
  }

  .foot {
    margin: 28px auto 0;
    max-width: 34ch;
    font-size: 15px;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.58);
  }

  /* ── Hold to exit ──────────────────────────────────── */
  .exit {
    position: fixed;
    z-index: 6;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px 10px 10px;
    border: 0;
    border-radius: 999px;
    background: rgba(10, 4, 34, 0.38);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    color: rgba(255, 255, 255, 0.7);
    font: 500 13px/1 var(--font);
    opacity: 0.5;
    touch-action: none;
    transition: opacity 0.2s ease;
  }
  .exit[hidden] { display: none; }
  .exit.holding { opacity: 1; }

  .ring {
    width: 22px;
    height: 22px;
    transform: rotate(-90deg);
  }
  .ring circle {
    fill: none;
    stroke-width: 3.2;
  }
  .ring .track { stroke: rgba(255, 255, 255, 0.28); }
  .ring .prog {
    stroke: #fff;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    transition: stroke-dashoffset 0.2s ease-out;
  }
  .exit.holding .prog {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset var(--hold, 1.5s) linear;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .start { animation: none; }
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<section id="intro" class="intro">
  <div class="card">
    <h1>Tiny Pops</h1>
    <p class="intro-text">Tap, smash and swipe the screen.<br />Use as many fingers as you like.</p>
    <button id="start" class="start" type="button">Start</button>
    <p class="foot">Grown-ups: hold the small exit button in the corner to come back here.</p>
  </div>
</section>

<button id="exit" class="exit" type="button" hidden aria-label="Hold to exit">
  <svg class="ring" viewBox="0 0 22 22" aria-hidden="true">
    <circle class="track" cx="11" cy="11" r="8" pathLength="100"></circle>
    <circle class="prog" cx="11" cy="11" r="8" pathLength="100"></circle>
  </svg>
  <span>hold to exit</span>
</button>

<script>
(() => {
  'use strict';

  // ── Config ────────────────────────────────────────────────────────────
  const CFG = {
    popSize: [120, 230],     // tap emoji size (px)
    popLife: [1700, 2400],   // ms
    maxPops: 60,
    maxParts: 700,           // sparkles + flying mini emojis
    trailLife: 680,          // ms a comet tail lives
    trailWidth: 19,
    holdMs: 1500,            // hold-to-exit duration
  };

  const TAU = Math.PI * 2;
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

  // Only emoji that exist on older iPadOS versions, all friendly.
  const EMOJI = [
    '🥰','😊','😍','🤩','😸','😻','☺️','🤭','😜','😇',
    '🦄','🐴','🐎','🐣','🐥','🦋','🐙','🐸','🐰','🐱','🐶','🦊',
    '🐼','🐨','🦁','🐝','🐞','🦜','🐻','🐷','🐮','🐹',
    '🐧','🦆','🐢','🐳','🐬','🦒','🐘','🦔','🦉',
    '🍓','🍉','🍒','🍑','🍩','🧁','🍪','🍭','🎂','🍦','🍬','🍰','🍎','🍌',
    '🌈','🌟','✨','🌸','🌼','🌺','🍀','🌻','🍄','🌙','🌷','☁️',
    '🎈','🧸','🚀','⭐','💎','🎵','🎨','🎪','🎠','🪁','🎀','🎁','🎉','🎊','🔮',
    '❤️','💜','💙','💚','💛','🧡','💖','💝','💗','💕',
  ];

  // ── Canvas ────────────────────────────────────────────────────────────
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  const bg = document.createElement('canvas');   // low-res background, scaled up = free blur
  const bgx = bg.getContext('2d');

  let W = window.innerWidth;
  let H = window.innerHeight;
  let DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    bg.width = Math.max(64, Math.round(W / 8));
    bg.height = Math.max(48, Math.round(H / 8));
  }

  // ── Pre-rendered sprites ──────────────────────────────────────────────
  const SPR_FONT = 128;
  const CELL = 208;
  const K = CELL / SPR_FONT;
  const emojiSprites = [];

  function bakeEmoji() {
    const font = `${SPR_FONT}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    for (const e of EMOJI) {
      const c = document.createElement('canvas');
      c.width = c.height = CELL;
      const g = c.getContext('2d');
      g.font = font;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.shadowColor = 'rgba(10, 0, 40, 0.35)';
      g.shadowBlur = 16;
      g.shadowOffsetY = 7;
      g.fillText(e, CELL / 2, CELL / 2 + 6);
      emojiSprites.push(c);
    }
  }

  const GLOW_N = 36;
  const glows = [];
  let glowWhite = null;

  function makeGlow(hue, sat) {
    const c = document.createElement('canvas');
    c.width = c.height = 96;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(48, 48, 0, 48, 48, 48);
    gr.addColorStop(0, `hsla(${hue},${sat}%,94%,1)`);
    gr.addColorStop(0.18, `hsla(${hue},${sat}%,78%,0.85)`);
    gr.addColorStop(0.5, `hsla(${hue},${sat}%,62%,0.25)`);
    gr.addColorStop(1, `hsla(${hue},${sat}%,55%,0)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, 96, 96);
    return c;
  }
  function bakeGlows() {
    for (let i = 0; i < GLOW_N; i++) glows.push(makeGlow(i * (360 / GLOW_N), 100));
    glowWhite = makeGlow(0, 0);
  }
  const glowFor = (hue) => glows[Math.floor((((hue % 360) + 360) % 360) / (360 / GLOW_N)) % GLOW_N];

  // Shuffle-bag so the same emoji never repeats back to back.
  // Big tap emoji and small flying ones draw from separate shuffle-bags, so every
  // emoji gets its turn as a big one instead of mostly being used up as a tiny one.
  const bags = { big: [], small: [] };
  let lastIdx = -1;
  const HORSES = ['🐴', '🦄', '🐎'];
  const HORSE_CHANCE = 0.1;   // extra chance that a tap/smash emoji is a horse
  function nextEmoji(horseChance, big) {
    if (horseChance && Math.random() < horseChance) {
      let i;
      do { i = EMOJI.indexOf(HORSES[Math.floor(Math.random() * HORSES.length)]); } while (i === lastIdx);
      lastIdx = i;
      return emojiSprites[i];
    }
    const key = big ? 'big' : 'small';
    let bag = bags[key];
    if (!bag.length) {
      bag = bags[key] = emojiSprites.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      if (bag[bag.length - 1] === lastIdx) bag.unshift(bag.pop());
    }
    lastIdx = bag.pop();
    return emojiSprites[lastIdx];
  }

  function drawSprite(spr, x, y, size, rot, alpha) {
    const w = size * K;
    const c = Math.cos(rot) * DPR;
    const s = Math.sin(rot) * DPR;
    ctx.setTransform(c, s, -s, c, x * DPR, y * DPR);
    ctx.globalAlpha = alpha;
    ctx.drawImage(spr, -w / 2, -w / 2, w, w);
  }
  const resetTransform = () => ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // ── Background ────────────────────────────────────────────────────────
  const BLOBS = [
    { c: '255,111,174', a: 0.34, r: 0.60, fx: 0.13, fy: 0.17, px: 0.0, py: 1.0 },
    { c: '61,224,208',  a: 0.24, r: 0.55, fx: 0.11, fy: 0.15, px: 2.0, py: 0.3 },
    { c: '255,211,106', a: 0.16, r: 0.50, fx: 0.17, fy: 0.10, px: 4.0, py: 2.2 },
    { c: '142,107,255', a: 0.40, r: 0.65, fx: 0.09, fy: 0.14, px: 1.0, py: 3.5 },
    { c: '90,168,255',  a: 0.24, r: 0.55, fx: 0.15, fy: 0.12, px: 5.0, py: 4.8 },
  ];
  const STARS = Array.from({ length: 70 }, () => ({
    x: Math.random(), y: Math.random(),
    r: rand(5, 16), sp: rand(0.6, 2.2), ph: rand(0, TAU),
  }));

  function drawBackground(tSec) {
    const bw = bg.width, bh = bg.height;
    const t = tSec * (REDUCED ? 0.3 : 1);
    const lg = bgx.createLinearGradient(0, 0, 0, bh);
    lg.addColorStop(0, '#1d1250');
    lg.addColorStop(1, '#2b1766');
    bgx.globalCompositeOperation = 'source-over';
    bgx.fillStyle = lg;
    bgx.fillRect(0, 0, bw, bh);
    bgx.globalCompositeOperation = 'lighter';
    for (const b of BLOBS) {
      const x = bw * (0.5 + 0.38 * Math.sin(t * b.fx + b.px));
      const y = bh * (0.5 + 0.38 * Math.cos(t * b.fy + b.py));
      const r = Math.max(bw, bh) * b.r;
      const g = bgx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${b.c},${b.a})`);
      g.addColorStop(1, `rgba(${b.c},0)`);
      bgx.fillStyle = g;
      bgx.fillRect(0, 0, bw, bh);
    }
    bgx.globalCompositeOperation = 'source-over';

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bg, 0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const s of STARS) {
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(tSec * s.sp + s.ph));
      const sz = s.r * 2;
      ctx.drawImage(glowWhite, s.x * W - sz / 2, s.y * H - sz / 2, sz, sz);
    }
  }

  // ── Entities ──────────────────────────────────────────────────────────
  const pops = [];      // big emoji where you tap
  const parts = [];     // glow sparkles (k=0) and flying mini emoji (k=1)
  const rings = [];     // shockwave rings
  const pointers = new Map();   // active fingers → comet state
  const fading = [];            // released comets whose tails are still fading

  function spawnPop(x, y, ambient) {
    const now = performance.now();
    const size = ambient ? rand(80, 150) : rand(CFG.popSize[0], CFG.popSize[1]);
    pops.push({
      x, y, size, born: now,
      spr: nextEmoji(ambient ? 0 : HORSE_CHANCE, true),
      life: rand(CFG.popLife[0], CFG.popLife[1]),
      rot: rand(-0.5, 0.5),
      wob: rand(0.08, 0.2) * (REDUCED ? 0.3 : 1),
      wspd: rand(5, 9),
      wph: rand(0, TAU),
      vx: rand(-16, 16),
      vy: rand(-80, -35),
      spin: rand(-0.35, 0.35) * (REDUCED ? 0.3 : 1),
      alpha: ambient ? 0.9 : 1,
    });
    if (pops.length > CFG.maxPops) {
      const o = pops[pops.length - CFG.maxPops - 1];
      o.life = Math.min(o.life, now - o.born + 160);
    }
  }

  function addGlow(x, y, vx, vy, o) {
    if (parts.length >= CFG.maxParts) return;
    parts.push({
      k: 0, x, y, vx, vy,
      g: o.g || 0,
      drag: o.drag != null ? o.drag : 2,
      size: o.size || 40,
      rot: 0, spin: 0,
      born: performance.now(),
      life: o.life || 600,
      hue: o.hue != null ? o.hue : rand(0, 360),
      a: o.a != null ? o.a : 1,
    });
  }

  function addMini(x, y, vx, vy, o) {
    if (parts.length >= CFG.maxParts) return;
    parts.push({
      k: 1, x, y, vx, vy,
      spr: nextEmoji(o.horses ? HORSE_CHANCE : 0),
      g: o.g != null ? o.g : 520,
      drag: o.drag != null ? o.drag : 1.1,
      size: o.size || rand(34, 72),
      rot: rand(-1, 1),
      spin: rand(-5, 5) * (REDUCED ? 0.3 : 1),
      born: performance.now(),
      life: o.life || rand(900, 1500),
      hue: 0,
    });
  }

  function tapBurst(x, y) {
    spawnPop(x, y, false);
    const hue0 = rand(0, 360);
    rings.push({ x, y, born: performance.now(), life: 650, max: rand(120, 180), hue: hue0 });
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU), sp = rand(160, 520);
      addGlow(x, y, Math.cos(a) * sp, Math.sin(a) * sp, {
        size: rand(34, 76), life: rand(450, 800), drag: 3.2, hue: hue0 + rand(-60, 60),
      });
    }
    for (let i = 0; i < 4; i++) {
      const a = rand(0, TAU), sp = rand(220, 520);
      addMini(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 120, { size: rand(36, 64), g: 600, horses: true });
    }
  }

  // ── Comet trails (drag) ───────────────────────────────────────────────
  function stampOf(ev, now) {
    const ts = ev.timeStamp;
    if (ts > 0 && Math.abs(ts - now) < 1000) return Math.min(ts, now);
    return now;
  }

  function addPoint(tr, x, y, ts) {
    const px = tr.x, py = tr.y;
    const dx = x - px, dy = y - py;
    const d = Math.hypot(dx, dy);
    if (d < 2) return;

    const dtm = Math.max(8, ts - tr.lastT) / 1000;
    tr.vx = tr.vx * 0.6 + (dx / dtm) * 0.4;
    tr.vy = tr.vy * 0.6 + (dy / dtm) * 0.4;
    const sp = Math.hypot(tr.vx, tr.vy);
    if (sp > 3000) { tr.vx *= 3000 / sp; tr.vy *= 3000 / sp; }

    tr.lastT = ts;
    tr.x = x; tr.y = y;
    tr.pts.push({ x, y, t: ts });

    // Warm palette: the comet's base tone slowly wanders between gold and coral.
    tr.dist += d;
    tr.hue = 44 + 12 * Math.sin(tr.dist * 0.004 + tr.phase);
    tr.acc += d;
    tr.sacc += d;

    const ang = Math.atan2(dy, dx);

    // Sparkles and emoji are placed along the segment, not piled at its end,
    // so fast swipes don't leave clumps with gaps between them.
    let guard = 0;
    while (tr.sacc >= 20 && guard++ < 10) {
      const u = Math.min(1, Math.max(0, (d - (tr.sacc - 20)) / d));
      tr.sacc -= 20;
      addGlow(px + dx * u + rand(-5, 5), py + dy * u + rand(-5, 5), rand(-30, 30), rand(-30, 30), {
        size: rand(30, 58), life: rand(500, 850), drag: 2, a: 0.32,
        hue: tr.hue - rand(0, 35),
      });
    }

    guard = 0;
    while (tr.acc >= tr.gap && guard++ < 6) {
      const u = Math.min(1, Math.max(0, (d - (tr.acc - tr.gap)) / d));
      tr.acc -= tr.gap;
      tr.gap = rand(34, 66);
      const side = Math.random() < 0.5 ? -1 : 1;
      const a = ang + side * Math.PI / 2 + rand(-0.9, 0.9);
      const v = rand(140, 380);
      addMini(px + dx * u, py + dy * u,
        Math.cos(a) * v + tr.vx * 0.12, Math.sin(a) * v + tr.vy * 0.12, {});
    }
    if (tr.acc > 300) tr.acc = 0;
    if (tr.sacc > 200) tr.sacc = 0;
  }

  // The comet is a smooth curve through the touch points, stamped densely with
  // soft glow sprites. Overlapping soft sprites blend into a continuous glow, so
  // there are no joints or caps to show up as dots, however fast the finger moves.
  function drawTrail(tr, now) {
    const pts = tr.pts;
    while (pts.length && now - pts[0].t > CFG.trailLife) pts.shift();
    const n = pts.length;

    if (n > 1) {
      const lives = pts.map((p) => 1 - (now - p.t) / CFG.trailLife);
      let total = 0;
      for (let i = 1; i < n; i++) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      const step = Math.max(4, total / 150);
      const dens = step / 4;
      const base = CFG.trailWidth * 0.75;
      const span = CFG.trailWidth * 4.0;

      const stamp = (x, y, l) => {
        if (l <= 0) return;
        const lp = Math.pow(l, 0.9);
        const size = base + span * lp;
        const hue = tr.hue - 30 * Math.pow(1 - l, 0.8);       // gold → amber → orange
        ctx.globalAlpha = Math.min(0.5, 0.14 * dens * Math.pow(l, 1.1));
        ctx.drawImage(glowFor(hue), x - size / 2, y - size / 2, size, size);
        const core = size * 0.45;                             // hot gold core
        ctx.globalAlpha = Math.min(0.5, 0.075 * dens * Math.pow(l, 1.4));
        ctx.drawImage(glowFor(tr.hue + 10), x - core / 2, y - core / 2, core, core);
      };
      const seg = (x0, y0, l0, cx, cy, x1, y1, l1) => {
        const len = Math.hypot(cx - x0, cy - y0) + Math.hypot(x1 - cx, y1 - cy);
        const k = Math.max(1, Math.round(len / step));
        for (let j = 0; j < k; j++) {
          const t = j / k, u = 1 - t;
          stamp(u * u * x0 + 2 * u * t * cx + t * t * x1,
                u * u * y0 + 2 * u * t * cy + t * t * y1,
                l0 + (l1 - l0) * t);
        }
      };
      const mx = (i) => (pts[i].x + pts[i + 1].x) / 2;
      const my = (i) => (pts[i].y + pts[i + 1].y) / 2;
      const ml = (i) => (lives[i] + lives[i + 1]) / 2;

      if (n === 2) {
        seg(pts[0].x, pts[0].y, lives[0], mx(0), my(0), pts[1].x, pts[1].y, lives[1]);
      } else {
        // tail end → first midpoint (straight)
        seg(pts[0].x, pts[0].y, lives[0],
            (pts[0].x + mx(0)) / 2, (pts[0].y + my(0)) / 2, mx(0), my(0), ml(0));
        // smooth middle: quadratic curves between midpoints, points act as controls
        for (let i = 1; i < n - 1; i++) {
          seg(mx(i - 1), my(i - 1), ml(i - 1), pts[i].x, pts[i].y, mx(i), my(i), ml(i));
        }
        // last midpoint → head (straight)
        const e = n - 2;
        seg(mx(e), my(e), ml(e),
            (mx(e) + pts[n - 1].x) / 2, (my(e) + pts[n - 1].y) / 2,
            pts[n - 1].x, pts[n - 1].y, lives[n - 1]);
      }
    }

    if (tr.active) {
      const sz = 150 + 14 * Math.sin(now / 90);
      ctx.globalAlpha = 0.9;
      ctx.drawImage(glowFor(tr.hue), tr.x - sz / 2, tr.y - sz / 2, sz, sz);
      const core = 64;
      ctx.globalAlpha = 1;
      ctx.drawImage(glowFor(tr.hue + 12), tr.x - core / 2, tr.y - core / 2, core, core);
      ctx.fillStyle = '#fff6dc';
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, 5.5, 0, TAU);
      ctx.fill();
    }
  }

  // ── Input (multitouch via Pointer Events) ─────────────────────────────
  let running = false;

  canvas.addEventListener('pointerdown', (e) => {
    if (!running) return;
    e.preventDefault();
    const now = performance.now();
    pointers.set(e.pointerId, {
      active: true,
      pts: [{ x: e.clientX, y: e.clientY, t: now }],
      x: e.clientX, y: e.clientY,
      lastT: now, lastSpark: now,
      vx: 0, vy: 0,
      hue: 44, dist: rand(0, 2000), phase: rand(0, TAU),
      acc: 0, sacc: 0, gap: rand(30, 55),
    });
    tapBurst(e.clientX, e.clientY);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!running) return;
    const tr = pointers.get(e.pointerId);
    if (!tr) return;
    e.preventDefault();
    const now = performance.now();
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    if (evs.length) {
      for (const ev of evs) addPoint(tr, ev.clientX, ev.clientY, stampOf(ev, now));
    } else {
      addPoint(tr, e.clientX, e.clientY, now);
    }
  });

  function endPointer(e) {
    const tr = pointers.get(e.pointerId);
    if (!tr) return;
    tr.active = false;
    pointers.delete(e.pointerId);
    fading.push(tr);
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // Keep iPad from zooming, scrolling, or selecting things.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
    document.addEventListener(t, (e) => e.preventDefault()));
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  canvas.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });

  // ── Render ────────────────────────────────────────────────────────────
  function updateParts(now, dt) {
    let w = 0;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (now - p.born >= p.life) continue;
      const damp = Math.exp(-p.drag * dt);
      p.vx *= damp;
      p.vy = p.vy * damp + p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
      parts[w++] = p;
    }
    parts.length = w;
  }

  function render(now, dt) {
    resetTransform();
    drawBackground(now / 1000);

    // Additive layer: comets, sparkles, rings
    ctx.globalCompositeOperation = 'lighter';

    for (const tr of pointers.values()) drawTrail(tr, now);
    let fw = 0;
    for (let i = 0; i < fading.length; i++) {
      const tr = fading[i];
      drawTrail(tr, now);
      if (tr.pts.length > 1) fading[fw++] = tr;
    }
    fading.length = fw;

    for (const p of parts) {
      if (p.k !== 0) continue;
      const t = (now - p.born) / p.life;
      const sz = p.size * (1 - 0.5 * t);
      ctx.globalAlpha = p.a * Math.pow(1 - t, 1.3);
      ctx.drawImage(glowFor(p.hue), p.x - sz / 2, p.y - sz / 2, sz, sz);
    }

    let rw = 0;
    for (let i = 0; i < rings.length; i++) {
      const r = rings[i];
      const t = (now - r.born) / r.life;
      if (t >= 1) continue;
      rings[rw++] = r;
      ctx.globalAlpha = 1;
      ctx.lineWidth = 7 * (1 - t) + 1;
      ctx.strokeStyle = `hsla(${r.hue},100%,78%,${(1 - t) * 0.8})`;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.max * easeOutCubic(t), 0, TAU);
      ctx.stroke();
    }
    rings.length = rw;

    // Normal layer: big pops, then flying mini emoji
    ctx.globalCompositeOperation = 'source-over';

    let w = 0;
    for (let i = 0; i < pops.length; i++) {
      const p = pops[i];
      const age = now - p.born;
      if (age >= p.life) continue;
      pops[w++] = p;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      let s = age < 260 ? easeOutBack(age / 260) : 1 + 0.045 * Math.sin(age / 140 + p.wph);
      let a = p.alpha;
      const fo = age / p.life;
      if (fo > 0.68) {
        const f = (fo - 0.68) / 0.32;
        a *= 1 - f;
        s *= 1 + 0.25 * f;
      }
      const rot = p.rot + Math.sin((age / 1000) * p.wspd + p.wph) * p.wob + p.spin * (age / 1000);
      drawSprite(p.spr, p.x, p.y, p.size * s, rot, a);
    }
    pops.length = w;

    for (const p of parts) {
      if (p.k !== 1) continue;
      const t = (now - p.born) / p.life;
      const s = (t < 0.12 ? easeOutBack(t / 0.12) : 1) * (1 - 0.25 * t);
      const a = t > 0.6 ? 1 - (t - 0.6) / 0.4 : 1;
      drawSprite(p.spr, p.x, p.y, p.size * s, p.rot, a);
    }

    resetTransform();
    ctx.globalAlpha = 1;
  }

  // ── Main loop ─────────────────────────────────────────────────────────
  let last = performance.now();
  let nextAmbient = 0;
  let ema = 16.7;
  let lastAdapt = 0;

  function frame() {
    requestAnimationFrame(frame);
    // Use the same clock as the input handlers so a brand-new entity can never have a negative age.
    const now = performance.now();
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // Keep the intro screen alive with the odd floating emoji.
    if (!running && now > nextAmbient) {
      nextAmbient = now + rand(600, 1200);
      spawnPop(rand(0.08, 0.92) * W, rand(0.12, 0.9) * H, true);
    }

    // A finger resting on the glass keeps shedding sparkles.
    for (const tr of pointers.values()) {
      if (now - tr.lastSpark > 130) {
        tr.lastSpark = now;
        addGlow(tr.x, tr.y, rand(-60, 60), rand(-90, -20), {
          size: rand(26, 50), life: rand(500, 900), drag: 1.5, a: 0.4, hue: tr.hue - rand(0, 35),
        });
      }
    }

    updateParts(now, dt);
    render(now, dt);

    // If an older iPad struggles, quietly drop the render resolution.
    ema = ema * 0.95 + dt * 1000 * 0.05;
    if (running && now - lastAdapt > 2500 && ema > 27 && DPR > 1.25) {
      DPR = Math.max(1.25, DPR - 0.25);
      lastAdapt = now;
      resize();
    }
  }

  // ── Start / exit / fullscreen ─────────────────────────────────────────
  const intro = document.getElementById('intro');
  const startBtn = document.getElementById('start');
  const exitBtn = document.getElementById('exit');

  exitBtn.style.setProperty('--hold', CFG.holdMs + 'ms');

  const isFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  let fsEntered = false;

  function requestFS() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen) {
        const p = el.requestFullscreen({ navigationUI: 'hide' });
        if (p && p.catch) p.catch(() => {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
    } catch (_) { /* windowed mode still works */ }
  }
  function exitFS() {
    try {
      if (document.exitFullscreen) {
        const p = document.exitFullscreen();
        if (p && p.catch) p.catch(() => {});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } catch (_) {}
  }

  // Keep the screen awake while a little one is playing.
  let wake = null;
  async function acquireWake() {
    try {
      if ('wakeLock' in navigator && !wake) {
        wake = await navigator.wakeLock.request('screen');
        wake.addEventListener('release', () => { wake = null; });
      }
    } catch (_) {}
  }
  function releaseWake() {
    try { if (wake) wake.release(); } catch (_) {}
    wake = null;
  }

  function start() {
    if (running) return;
    requestFS();                      // must happen inside the tap handler
    running = true;
    intro.classList.add('is-hidden');
    exitBtn.hidden = false;
    acquireWake();
  }

  function stop() {
    if (!running) return;
    running = false;
    pointers.clear();
    intro.classList.remove('is-hidden');
    exitBtn.hidden = true;
    releaseWake();
    if (isFS()) exitFS();
  }

  startBtn.addEventListener('click', start);

  // Hold-to-exit
  let holdTimer = null;
  function cancelHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    exitBtn.classList.remove('holding');
  }
  exitBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    exitBtn.classList.add('holding');
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { cancelHold(); stop(); }, CFG.holdMs);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => exitBtn.addEventListener(t, cancelHold));
  exitBtn.addEventListener('contextmenu', (e) => e.preventDefault());

  // If fullscreen ends by some other route, go back to the intro rather than
  // leaving a windowed canvas running.
  function onFSChange() {
    if (isFS()) {
      fsEntered = true;
    } else if (fsEntered) {
      fsEntered = false;
      stop();
    }
  }
  document.addEventListener('fullscreenchange', onFSChange);
  document.addEventListener('webkitfullscreenchange', onFSChange);

  document.addEventListener('visibilitychange', () => {
    pointers.clear();
    if (document.visibilityState === 'visible' && running) acquireWake();
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));

  // ── Go ────────────────────────────────────────────────────────────────
  bakeEmoji();
  bakeGlows();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
